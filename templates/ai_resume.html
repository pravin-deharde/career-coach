{% extends "layout.html" %}

{% block title %}AI Resume Scanner{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card bg-dark text-white shadow-lg p-4">

        <h2 class="text-center text-info mb-4">
            🤖 AI Resume Scanner
        </h2>

        <form action="/ai-resume" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Upload Resume (PDF/DOCX)</label>

                <input
                    type="file"
                    class="form-control"
                    name="resume"
                    accept=".pdf,.doc,.docx"
                    required>
            </div>

            <button class="btn btn-primary w-100">
                Scan Resume
            </button>

        </form>

        {% if result %}

        <hr>

        <h4 class="text-success mt-4">
            Analysis Result
        </h4>

        <div class="alert alert-info mt-3">

            <pre class="text-white" style="white-space: pre-wrap;">
{{ result }}
</pre>

        </div>

        {% endif %}

    </div>

</div>

{% endblock %}
