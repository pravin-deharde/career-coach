{% extends "layout.html" %}

{% block title %}Post Job{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Post New Job</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Job Title</label>

<input
type="text"
class="form-control"
name="title"
required>

</div>

<div class="mb-3">

<label>Company</label>

<input
type="text"
class="form-control"
name="company"
required>

</div>

<div class="mb-3">

<label>Location</label>

<input
type="text"
class="form-control"
name="location"
required>

</div>

<div class="mb-3">

<label>Salary</label>

<input
type="text"
class="form-control"
name="salary"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
class="form-control"
rows="5"
name="description"
required></textarea>

</div>

<button
class="btn btn-success">

Post Job

</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
